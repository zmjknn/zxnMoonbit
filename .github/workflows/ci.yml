name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install MoonBit
        shell: bash
        env:
          MOONBIT_VERSION: 0.1.20260713
        run: |
          curl --fail --location https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version

      - name: Moon format check
        run: moon fmt --check

      - name: Moon type check
        run: moon check --deny-warn

      - name: Moon tests
        run: moon test --deny-warn

      - name: Moon benchmarks
        run: moon bench

      - name: CLI smoke test
        run: moon run src/cli -- --help
